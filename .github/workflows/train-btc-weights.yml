name: Train BTC model weights

on:
  push:
    branches: [main]
    paths:
      - "train_btc_weights.py"
      - ".github/workflows/train-btc-weights.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btc-model-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install training dependencies
        run: python -m pip install --upgrade pip && pip install numpy pandas requests scikit-learn lightgbm catboost
      - name: Train on Binance historical candles
        run: python train_btc_weights.py
      - name: Commit real trained weights
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add btc-weights.json
          git commit -m "Add trained BTC model weights" || echo "No weight changes to commit"
          git push
