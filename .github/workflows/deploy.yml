# Trigger scoring-balance deployment
# Trigger a fresh Pages deployment of the restored main snapshot.
name: Deploy BTC RADAR Next.js app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "next-app/**"
      - ".github/workflows/deploy.yml"
      - "btc-weights.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-app/package.json
      - name: Install dependencies
        working-directory: next-app
        run: npm install
      - name: Include trained BTC weights as a public asset
        run: cp btc-weights.json next-app/public/btc-weights.json
      - name: Build and export latest Next.js app
        working-directory: next-app
        run: npm run build
      - name: Upload Next.js static export
        uses: actions/upload-pages-artifact@v3
        with:
          path: next-app/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
