name: Next.js migration build

on:
  push:
    branches:
      - nextjs-migration
    paths:
      - "next-app/**"
      - ".github/workflows/nextjs-check.yml"
  pull_request:
    branches:
      - main
    paths:
      - "next-app/**"
      - ".github/workflows/nextjs-check.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Next.js app
        run: npm run build
